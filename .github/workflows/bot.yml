name: bazaraki-bot

on:
  schedule:
    # Every 5 min (GitHub's minimum). Each run long-polls Telegram for ~4.5 min
    # (LOOP_SECONDS) for near real-time replies; the Bazaraki search itself is
    # rate-limited in code to once per hour. Needs a PUBLIC repo (unlimited
    # Actions minutes) — on a private repo this would blow past the free 2000 min.
    - cron: "*/5 * * * *"
  workflow_dispatch: {}   # allow manual "Run workflow" from the Actions tab

# Never run two instances at once — they'd fight over state.json / Telegram updates.
concurrency:
  group: bazaraki-bot
  cancel-in-progress: false

permissions:
  contents: write   # needed to commit the updated state.json back to the repo

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 6   # safety cap; the loop self-exits after LOOP_SECONDS
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          SCRAPER_API_KEY: ${{ secrets.SCRAPER_API_KEY }}        # enables service fetch on Actions
          SCRAPER_PROVIDER: ${{ vars.SCRAPER_PROVIDER }}         # optional: scrapingant(default)/scraperapi/scrapingbee
          SCRAPER_PROXY_TYPE: ${{ vars.SCRAPER_PROXY_TYPE }}     # optional: datacenter(default)/residential
          QUIET_START_HOUR: ${{ vars.QUIET_START_HOUR }}         # optional, Cyprus time, default 1
          QUIET_END_HOUR: ${{ vars.QUIET_END_HOUR }}             # optional, Cyprus time, default 6
          LOOP_SECONDS: "270"                                    # long-poll ~4.5 min per run, then exit
          POLL_INTERVAL_MINUTES: ${{ vars.POLL_INTERVAL_MINUTES }}  # optional, default 30
          OWNER_CHAT_ID: ${{ vars.OWNER_CHAT_ID }}                 # optional: pin the owner; else first contact
        run: python bot.py

      - name: Persist state
        run: |
          git config user.name "bazaraki-bot"
          git config user.email "bot@users.noreply.github.com"
          if ! git diff --quiet -- state.json; then
            git add state.json
            git commit -m "Update state [skip ci]"
            # Rebase in case another run pushed meanwhile, then push.
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            git push
          else
            echo "No state changes to commit."
          fi
