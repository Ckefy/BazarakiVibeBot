name: bazaraki-bot

on:
  schedule:
    # Every 5 min. Each run long-polls Telegram for ~50 min (LOOP_SECONDS). Because
    # the window is long, at least one cron tick lands inside it and queues the next
    # run (concurrency = pending), which starts the instant this one ends — so
    # coverage is near-continuous despite GitHub's unreliable cron scheduling.
    # Needs a PUBLIC repo (Actions minutes are unlimited there).
    - cron: "*/5 * * * *"
  workflow_dispatch: {}   # allow manual "Run workflow" from the Actions tab

# Never run two instances at once — they'd fight over state.json / Telegram updates.
concurrency:
  group: bazaraki-bot
  cancel-in-progress: false

permissions:
  contents: write   # needed to commit the updated state.json back to the repo

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 55   # safety cap; the loop self-exits after LOOP_SECONDS (~50 min)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          SCRAPER_API_KEY: ${{ secrets.SCRAPER_API_KEY }}        # enables service fetch on Actions
          SCRAPER_PROVIDER: ${{ vars.SCRAPER_PROVIDER }}         # optional: scrapingant(default)/scraperapi/scrapingbee
          SCRAPER_PROXY_TYPE: ${{ vars.SCRAPER_PROXY_TYPE }}     # optional: datacenter(default)/residential
          QUIET_START_HOUR: ${{ vars.QUIET_START_HOUR }}         # optional, Cyprus time, default 1
          QUIET_END_HOUR: ${{ vars.QUIET_END_HOUR }}             # optional, Cyprus time, default 6
          LOOP_SECONDS: "3000"                                   # long-poll ~50 min per run, then hand off
          GIT_PERSIST: "1"                                       # commit state mid-loop so kills don't lose progress
          POLL_INTERVAL_MINUTES: ${{ vars.POLL_INTERVAL_MINUTES }}  # optional, default 30
          OWNER_CHAT_ID: ${{ vars.OWNER_CHAT_ID }}                 # optional: pin the owner; else first contact
        run: python bot.py

      - name: Persist state
        run: |
          git config user.name "bazaraki-bot"
          git config user.email "bot@users.noreply.github.com"
          if ! git diff --quiet -- state.json; then
            git add state.json
            git commit -m "Update state [skip ci]"
            # Rebase in case another run pushed meanwhile, then push.
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            git push
          else
            echo "No state changes to commit."
          fi
